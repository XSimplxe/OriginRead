name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述使用场景，再描述你期望的解决方案。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 这个功能解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 你考虑过的其他做法
    validations:
      required: false
